name: Test Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux-amd64-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.4"
          cache: true

      - name: Setup web and musl
        run: |
          set -euo pipefail
          (
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends musl-tools
          ) &
          apt_pid=$!
          bash build.sh dev web
          wait "$apt_pid"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build
        env:
          CGO_ENABLED: "1"
          CC: musl-gcc
        run: |
          set -euo pipefail
          mkdir -p build
          built_at="$(date +'%F %T %z')"
          git_commit="${GITHUB_SHA::7}"
          go build -o build/openlist -tags=jsoniter \
            -ldflags="-linkmode external -extldflags '-static -fpic' -w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${built_at}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${git_commit}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=dev' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling'" \
            .

      - name: Verify musl binary is static
        run: |
          set -euo pipefail
          if readelf -l build/openlist | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: build/openlist"
            readelf -l build/openlist | grep "Requesting program interpreter" || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openlist-linux-amd64-musl
          path: build/*
          compression-level: 0
